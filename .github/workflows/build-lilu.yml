name: Build Custom Lilu

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Lilu Code
      uses: actions/checkout@v4

    - name: Compile Lilu Kext
      run: |
        xcodebuild \
          -project "Lilu.xcodeproj" \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Upload Custom Lilu Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Custom-Lilu-Kext
        path: build/Release/*.kext
